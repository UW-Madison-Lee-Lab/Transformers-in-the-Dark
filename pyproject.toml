[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tind"
version = "0.1.0"
description = "Transformers in the Dark: Navigating Unknown Search Spaces via Bandit Feedback"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.4.2",
    "torch==2.10.0",
    "tqdm==4.67.3",
    "transformers==4.52.4",
    "wandb==0.25.1",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["tind*"]
namespaces = true